<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Handler – Kundendetail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-od-id="sidebar">
      <div class="app-title">
        <span class="app-mark" aria-hidden="true">BH</span>
        <span class="app-title-text">Business Handler</span>
      </div>
      <nav class="nav" aria-label="Hauptnavigation">
        <a class="nav-item" href="index.html" data-od-id="nav-dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2.5" y="2.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11.5" y="2.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2.5" y="11.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11.5" y="11.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" href="customers.html" aria-current="page" data-od-id="nav-customers">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="7" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2.5 15c0-2.2 2-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="14" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13.5 11c2.2 0 4 1.6 4 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Kunden</span>
        </a>
      </nav>
    </aside>

    <main class="main" data-od-id="main">
      <header class="topbar" data-od-id="topbar">
        <div class="page-title">
          <h1 data-od-id="page-title">Kundendetail</h1>
          <p class="subtitle">Alle Informationen zu einem Kunden</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-primary btn-md" disabled data-od-id="new-order-button">
            Neuer Auftrag
            <span class="coming-soon">Coming soon</span>
          </button>
        </div>
      </header>

      <div class="content-body">
        <a class="btn btn-ghost btn-sm back-link" href="customers.html" data-od-id="back-to-customers">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Zur Kundenliste
        </a>

        <div id="detail-root"></div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    (function () {
      var BH = window.BH;
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var customer = id ? BH.getCustomerById(id) : null;
      var root = document.getElementById("detail-root");

      if (!customer) {
        renderNotFound();
        return;
      }
      renderDetail(customer);
    })();

    function icon(name) {
      var icons = {
        mail: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M2 4l6 5 6-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        phone: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 2.5l2 1.5L6 6l-1.5 1.5a9 9 0 006 6L12 12l2 .5 1.5 2-1 1a1.5 1.5 0 01-1.6.3A13 13 0 012.8 5.1a1.5 1.5 0 01.3-1.6l1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
        pin: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 14.5S3 10.5 3 7a5 5 0 0110 0c0 3.5-5 7.5-5 7.5z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="7" r="1.75" stroke="currentColor" stroke-width="1.5"/></svg>'
      };
      return icons[name] || "";
    }

    function badgeHtml(st, prefix) {
      return '<span class="badge ' + st.cls + '"><span class="visually-hidden">' + prefix + ': </span>' + st.label + '</span>';
    }

    function renderNotFound() {
      var root = document.getElementById("detail-root");
      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-od-id", "not-found-state");
      card.innerHTML =
        '<div class="empty-state" style="max-width: none;">' +
          '<svg class="empty-illustration" viewBox="0 0 96 96" fill="none" aria-hidden="true">' +
            '<rect x="22" y="20" width="52" height="44" rx="8" fill="#ECEEFC" stroke="#DFE3EA" stroke-width="1.5"/>' +
            '<path d="M30 36h28M30 46h20M30 56h14" stroke="#C3C9D4" stroke-width="1.5" stroke-linecap="round"/>' +
            '<circle cx="62" cy="66" r="9" fill="#ECEEFC" stroke="#3B4FD8" stroke-width="1.5"/>' +
            '<path d="M68.5 72.5l7 7" stroke="#3B4FD8" stroke-width="1.5" stroke-linecap="round"/>' +
          '</svg>' +
          '<h2 class="empty-title">Kunde nicht gefunden</h2>' +
          '<p class="empty-body">Unter der angegebenen ID wurde kein Kunde gefunden. Möglicherweise ist der Datensatz entfernt oder die Adresse ist ungültig.</p>' +
          '<a class="btn btn-primary btn-md" href="customers.html">Zur Kundenliste</a>' +
        '</div>';
      root.appendChild(card);
    }

    function renderDetail(c) {
      var root = document.getElementById("detail-root");
      var frag = document.createDocumentFragment();

      // Header card
      var header = document.createElement("div");
      header.className = "card detail-header";
      header.setAttribute("data-od-id", "customer-header");
      var st = BH.customerStatus[c.status];
      header.innerHTML =
        '<span class="avatar avatar-lg" style="background:' + BH.avatarColor(c.name) + '" role="img" aria-label="Avatar von ' + c.name + '">' + BH.initials(c.name) + '</span>' +
        '<div class="detail-identity">' +
          '<h2 class="detail-name">' + c.name + '</h2>' +
          '<p class="detail-company">' + c.company + '</p>' +
          '<div class="detail-contact">' +
            '<span class="detail-contact-item">' + icon("mail") + c.email + '</span>' +
            '<span class="detail-contact-item">' + icon("phone") + c.phone + '</span>' +
            '<span class="detail-contact-item">' + icon("pin") + c.city + '</span>' +
          '</div>' +
        '</div>' +
        badgeHtml(st, "Status");
      frag.appendChild(header);

      // Tabs
      var tabs = document.createElement("div");
      tabs.className = "tabs";
      tabs.setAttribute("role", "tablist");
      tabs.setAttribute("aria-label", "Kundendetail-Bereiche");
      tabs.setAttribute("data-od-id", "detail-tabs");
      var tabsDef = [
        { id: "overview", label: "Übersicht" },
        { id: "orders", label: "Aufträge" },
        { id: "notes", label: "Notizen" }
      ];
      tabsDef.forEach(function (t, idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tab";
        b.id = "tab-" + t.id;
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", idx === 0 ? "true" : "false");
        b.setAttribute("aria-controls", "panel-" + t.id);
        b.setAttribute("data-od-id", "tab-" + t.id);
        b.textContent = t.label;
        tabs.appendChild(b);
      });
      frag.appendChild(tabs);

      // Panels
      var overview = renderOverview(c);
      var orders = renderOrders(c);
      var notes = renderNotes(c);
      frag.appendChild(overview);
      frag.appendChild(orders);
      frag.appendChild(notes);

      root.appendChild(frag);
      wireTabs(tabs);
    }

    function renderOverview(c) {
      var panel = document.createElement("div");
      panel.className = "tab-panel";
      panel.id = "panel-overview";
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", "tab-overview");
      panel.setAttribute("data-od-id", "panel-overview");

      var totalOrders = (c.orders || []).length;
      var sum = 0, count = 0, open = 0;
      var lastOrder = null;
      (c.orders || []).forEach(function (o) {
        if (o.status === "pending") { open++; }
        if (o.status !== "cancelled") { sum += o.amount; count++; }
        if (!lastOrder || o.date > lastOrder.date) { lastOrder = o; }
      });
      var avg = count ? sum / count : 0;

      var grid = document.createElement("div");
      grid.className = "detail-grid";

      var stamm = document.createElement("div");
      stamm.className = "card card-pad";
      stamm.setAttribute("data-od-id", "stammdaten-card");
      stamm.innerHTML =
        '<h3 class="section-title" style="margin-bottom: var(--space-3);">Stammdaten</h3>' +
        '<dl class="kv">' +
          '<dt>Firma</dt><dd>' + c.company + '</dd>' +
          '<dt>Ansprechpartner</dt><dd>' + c.name + '</dd>' +
          '<dt>E-Mail</dt><dd>' + c.email + '</dd>' +
          '<dt>Telefon</dt><dd>' + c.phone + '</dd>' +
          '<dt>Stadt</dt><dd>' + c.city + '</dd>' +
          '<dt>Kundennummer</dt><dd>' + c.id + '</dd>' +
          '<dt>Kunde seit</dt><dd>' + BH.formatDate(c.since) + '</dd>' +
          '<dt>Letzter Auftrag</dt><dd>' + (lastOrder ? BH.formatDate(lastOrder.date) : "—") + '</dd>' +
        '</dl>';
      grid.appendChild(stamm);

      var kennz = document.createElement("div");
      kennz.className = "card card-pad";
      kennz.setAttribute("data-od-id", "kennzahlen-card");
      kennz.innerHTML =
        '<h3 class="section-title" style="margin-bottom: var(--space-3);">Kennzahlen</h3>' +
        '<div class="mini-stats">' +
          '<div><div class="mini-stat-label">Gesamtumsatz</div><div class="mini-stat-value">' + BH.formatMoney(c.revenue) + '</div></div>' +
          '<div><div class="mini-stat-label">Anzahl Aufträge</div><div class="mini-stat-value">' + totalOrders + '</div></div>' +
          '<div><div class="mini-stat-label">Ø Auftragswert</div><div class="mini-stat-value">' + BH.formatMoney(avg) + '</div></div>' +
          '<div><div class="mini-stat-label">Offene Aufträge</div><div class="mini-stat-value">' + open + '</div></div>' +
        '</div>';
      grid.appendChild(kennz);

      panel.appendChild(grid);
      return panel;
    }

    function renderOrders(c) {
      var panel = document.createElement("div");
      panel.className = "tab-panel";
      panel.id = "panel-orders";
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", "tab-orders");
      panel.setAttribute("data-od-id", "panel-orders");
      panel.hidden = true;

      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-od-id", "orders-list");
      var ul = document.createElement("ul");
      ul.className = "list";

      var sorted = (c.orders || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      sorted.forEach(function (o) {
        var st = BH.orderStatus[o.status];
        var li = document.createElement("li");
        li.className = "list-row";
        li.innerHTML =
          '<span class="list-date">' + BH.formatDate(o.date) + '</span>' +
          '<span class="list-text" title="' + o.description + '">' + o.description + '</span>' +
          '<span class="list-value">' + BH.formatMoney(o.amount) + '</span>' +
          badgeHtml(st, "Status");
        ul.appendChild(li);
      });

      card.appendChild(ul);
      panel.appendChild(card);
      return panel;
    }

    function renderNotes(c) {
      var panel = document.createElement("div");
      panel.className = "tab-panel";
      panel.id = "panel-notes";
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", "tab-notes");
      panel.setAttribute("data-od-id", "panel-notes");
      panel.hidden = true;

      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-od-id", "notes-list");

      if (!c.notes || c.notes.length === 0) {
        card.innerHTML =
          '<div class="empty-state" style="max-width: none; padding: var(--space-5) var(--space-4);">' +
            '<p class="empty-body">Für diesen Kunden sind noch keine Notizen hinterlegt.</p>' +
          '</div>';
        panel.appendChild(card);
        return panel;
      }

      var ul = document.createElement("ul");
      ul.className = "list";
      c.notes.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (n) {
        var li = document.createElement("li");
        li.className = "list-row";
        li.innerHTML =
          '<span class="list-date">' + BH.formatDate(n.date) + '</span>' +
          '<span class="list-text" title="' + n.text + '">' + n.text + '</span>';
        ul.appendChild(li);
      });
      card.appendChild(ul);
      panel.appendChild(card);
      return panel;
    }

    function wireTabs(tabs) {
      var tabButtons = Array.prototype.slice.call(tabs.querySelectorAll('[role="tab"]'));
      var panels = {};
      tabButtons.forEach(function (b) {
        panels[b.id] = document.getElementById(b.getAttribute("aria-controls"));
      });

      function activate(target, focus) {
        tabButtons.forEach(function (b) {
          var active = b === target;
          b.setAttribute("aria-selected", active ? "true" : "false");
          b.tabIndex = active ? 0 : -1;
          panels[b.id].hidden = !active;
        });
        if (focus) { target.focus(); }
      }

      tabButtons.forEach(function (b, idx) {
        b.tabIndex = idx === 0 ? 0 : -1;
        b.addEventListener("click", function () { activate(b, false); });
        b.addEventListener("keydown", function (e) {
          var dir = 0;
          if (e.key === "ArrowRight") { dir = 1; }
          else if (e.key === "ArrowLeft") { dir = -1; }
          else if (e.key === "Home") { dir = -idx; }
          else if (e.key === "End") { dir = tabButtons.length - 1 - idx; }
          if (dir) {
            e.preventDefault();
            var next = (idx + dir + tabButtons.length) % tabButtons.length;
            activate(tabButtons[next], true);
          }
        });
      });
    }

    var topbar = document.querySelector(".topbar");
    function onScroll() { topbar.classList.toggle("is-scrolled", window.scrollY > 0); }
    window.addEventListener("scroll", onScroll);
    onScroll();
  </script>
</body>
</html>
