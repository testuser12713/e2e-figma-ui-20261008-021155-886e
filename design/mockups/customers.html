<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Handler – Kundenliste</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-od-id="sidebar">
      <div class="app-title">
        <span class="app-mark" aria-hidden="true">BH</span>
        <span class="app-title-text">Business Handler</span>
      </div>
      <nav class="nav" aria-label="Hauptnavigation">
        <a class="nav-item" href="index.html" data-od-id="nav-dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2.5" y="2.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11.5" y="2.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2.5" y="11.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11.5" y="11.5" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" href="customers.html" aria-current="page" data-od-id="nav-customers">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="7" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2.5 15c0-2.2 2-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="14" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13.5 11c2.2 0 4 1.6 4 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Kunden</span>
        </a>
      </nav>
    </aside>

    <main class="main" data-od-id="main">
      <header class="topbar" data-od-id="topbar">
        <div class="page-title">
          <h1 data-od-id="page-title">Kundenliste</h1>
          <p class="subtitle">Alle Kunden durchsuchen und verwalten</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-secondary btn-md" disabled data-od-id="new-customer-button">
            Neuer Kunde
            <span class="coming-soon">Coming soon</span>
          </button>
        </div>
      </header>

      <div class="content-body">
        <div class="toolbar" role="search" data-od-id="filter-toolbar">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" class="search-input" id="search-input" placeholder="Kunden suchen…" aria-label="Kunden suchen" data-od-id="search-input">
          </div>

          <div class="segmented" role="radiogroup" aria-label="Statusfilter" data-od-id="status-filter">
            <button type="button" role="radio" aria-checked="true" data-value="alle">Alle</button>
            <button type="button" role="radio" aria-checked="false" data-value="aktiv">Aktiv</button>
            <button type="button" role="radio" aria-checked="false" data-value="inaktiv">Inaktiv</button>
          </div>

          <button type="button" class="btn btn-ghost btn-sm" id="reset-filter" disabled data-od-id="reset-filter">Filter zurücksetzen</button>
        </div>

        <div class="filter-summary" id="filter-summary" data-od-id="filter-summary">12 Kunden</div>

        <div class="card table-card" data-od-id="customers-table">
          <table class="table" id="customers-table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Firma</th>
                <th scope="col" class="col-city">Ort</th>
                <th scope="col" class="num">Umsatz</th>
                <th scope="col" class="right">Status</th>
              </tr>
            </thead>
            <tbody id="customers-tbody"></tbody>
          </table>

          <div class="empty-state" id="empty-state" hidden>
            <svg class="empty-illustration" viewBox="0 0 96 96" fill="none" aria-hidden="true">
              <rect x="22" y="20" width="52" height="44" rx="8" fill="#ECEEFC" stroke="#DFE3EA" stroke-width="1.5"/>
              <path d="M30 36h28M30 46h20M30 56h14" stroke="#C3C9D4" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="62" cy="66" r="9" fill="#ECEEFC" stroke="#3B4FD8" stroke-width="1.5"/>
              <path d="M68.5 72.5l7 7" stroke="#3B4FD8" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <h2 class="empty-title">Keine Kunden gefunden</h2>
            <p class="empty-body">Ihre Suche und der Statusfilter ergeben zusammen keine Treffer. Setzen Sie die Filter zurück, um alle Kunden zu sehen.</p>
            <button type="button" class="btn btn-primary btn-md" id="empty-reset" data-od-id="empty-reset">Filter zurücksetzen</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    (function () {
      var BH = window.BH;
      var customers = BH.customers;

      var searchInput = document.getElementById("search-input");
      var segments = Array.prototype.slice.call(document.querySelectorAll(".segmented button"));
      var resetBtn = document.getElementById("reset-filter");
      var emptyReset = document.getElementById("empty-reset");
      var tbody = document.getElementById("customers-tbody");
      var table = document.getElementById("customers-table");
      var emptyState = document.getElementById("empty-state");
      var summary = document.getElementById("filter-summary");

      var state = { query: "", status: "alle" };

      function matches(c) {
        var q = state.query.trim().toLowerCase();
        var hay = (c.name + " " + c.company + " " + c.city).toLowerCase();
        var nameOk = !q || hay.indexOf(q) !== -1;
        var statusOk = state.status === "alle" || c.status === state.status;
        return nameOk && statusOk;
      }

      function render() {
        var visible = customers.filter(matches);
        tbody.innerHTML = "";
        var frag = document.createDocumentFragment();

        visible.forEach(function (c) {
          var tr = document.createElement("tr");
          tr.tabIndex = 0;
          tr.setAttribute("role", "link");
          tr.setAttribute("data-href", "customer-detail.html?id=" + c.id);
          tr.setAttribute("aria-label", c.name + ", " + c.company + " öffnen");

          var tdName = document.createElement("td");
          var cell = document.createElement("div");
          cell.className = "cell-name";

          var av = document.createElement("span");
          av.className = "avatar avatar-sm";
          av.style.background = BH.avatarColor(c.name);
          av.textContent = BH.initials(c.name);
          av.setAttribute("aria-hidden", "true");

          var nameWrap = document.createElement("div");
          var nameEl = document.createElement("div");
          nameEl.className = "name";
          nameEl.textContent = c.name;
          var idEl = document.createElement("div");
          idEl.className = "client-id";
          idEl.textContent = c.id;
          nameWrap.appendChild(nameEl);
          nameWrap.appendChild(idEl);

          cell.appendChild(av);
          cell.appendChild(nameWrap);
          tdName.appendChild(cell);
          tr.appendChild(tdName);

          var tdCompany = document.createElement("td");
          tdCompany.textContent = c.company;
          tr.appendChild(tdCompany);

          var tdCity = document.createElement("td");
          tdCity.className = "col-city";
          tdCity.textContent = c.city;
          tr.appendChild(tdCity);

          var tdRev = document.createElement("td");
          tdRev.className = "num";
          tdRev.textContent = BH.formatMoney(c.revenue);
          tr.appendChild(tdRev);

          var tdStatus = document.createElement("td");
          tdStatus.className = "right";
          var st = BH.customerStatus[c.status];
          var badge = document.createElement("span");
          badge.className = "badge " + st.cls;
          var sr = document.createElement("span");
          sr.className = "visually-hidden";
          sr.textContent = "Status: ";
          badge.appendChild(sr);
          badge.appendChild(document.createTextNode(st.label));
          tdStatus.appendChild(badge);
          tr.appendChild(tdStatus);

          tr.addEventListener("click", function () { window.location.href = tr.getAttribute("data-href"); });
          tr.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              window.location.href = tr.getAttribute("data-href");
            }
          });

          frag.appendChild(tr);
        });

        tbody.appendChild(frag);

        var filterActive = state.query.trim() !== "" || state.status !== "alle";
        var empty = filterActive && visible.length === 0;
        table.hidden = empty;
        emptyState.hidden = !empty;
        resetBtn.disabled = !filterActive;

        summary.textContent = visible.length === customers.length
          ? customers.length + " Kunden"
          : visible.length + " von " + customers.length + " Kunden";
      }

      function setStatus(value) {
        state.status = value;
        segments.forEach(function (b) {
          b.setAttribute("aria-checked", b.getAttribute("data-value") === value ? "true" : "false");
        });
        render();
      }

      function resetFilters() {
        state.query = "";
        state.status = "alle";
        searchInput.value = "";
        segments.forEach(function (b) {
          b.setAttribute("aria-checked", b.getAttribute("data-value") === "alle" ? "true" : "false");
        });
        render();
        searchInput.focus();
      }

      searchInput.addEventListener("input", function () {
        state.query = searchInput.value;
        render();
      });

      segments.forEach(function (btn, idx) {
        btn.addEventListener("click", function () { setStatus(btn.getAttribute("data-value")); });
        btn.addEventListener("keydown", function (e) {
          var dir = 0;
          if (e.key === "ArrowRight" || e.key === "ArrowDown") { dir = 1; }
          else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { dir = -1; }
          if (dir) {
            e.preventDefault();
            var next = (idx + dir + segments.length) % segments.length;
            setStatus(segments[next].getAttribute("data-value"));
            segments[next].focus();
          }
        });
      });

      resetBtn.addEventListener("click", resetFilters);
      emptyReset.addEventListener("click", resetFilters);

      render();
    })();

    var topbar = document.querySelector(".topbar");
    function onScroll() { topbar.classList.toggle("is-scrolled", window.scrollY > 0); }
    window.addEventListener("scroll", onScroll);
    onScroll();
  </script>
</body>
</html>
